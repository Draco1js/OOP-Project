name: Build and Release

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: ${{ matrix.platform.name }} Build
    runs-on: ${{ matrix.platform.os }}
    
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: Windows, os: windows-latest }
          - { name: Linux, os: ubuntu-latest }
          - { name: macOS, os: macos-latest }

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Linux Dependencies
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y libxrandr-dev libxcursor-dev libxi-dev libudev-dev libgl1-mesa-dev libegl1-mesa-dev libxinerama-dev libxext-dev libwayland-dev

    - name: Install raylib (Linux)
      if: runner.os == 'Linux'
      run: |
        git clone https://github.com/raysan5/raylib.git
        cd raylib/src
        make PLATFORM=PLATFORM_DESKTOP
        sudo make install

    - name: Install raylib (macOS)
      if: runner.os == 'macOS'
      run: |
        git clone https://github.com/raysan5/raylib.git
        cd raylib/src
        make PLATFORM=PLATFORM_DESKTOP
        sudo make install
        # Create symbolic links to ensure raylib.h is found in both locations
        sudo mkdir -p /opt/homebrew/include
        sudo ln -sf /usr/local/include/raylib.h /opt/homebrew/include/raylib.h
        # Copy raylib header to local include directory for direct access
        mkdir -p include
        cp raylib.h ../../include/

    - name: Install raylib (Windows)
      if: runner.os == 'Windows'
      run: |
        git clone https://github.com/raysan5/raylib.git
        cd raylib/src
        make PLATFORM=PLATFORM_DESKTOP
        # Create directories if they don't exist
        mkdir -p ../../include
        mkdir -p ../../lib || true
        # Copy files
        cp raylib.h ../../include/
        cp libraylib.a ../../lib/
      shell: bash

    - name: Build with Make
      run: |
        if [ "${{ runner.os }}" == "macOS" ]; then
          make PLATFORM=PLATFORM_DESKTOP OBJS=src/*.cpp INCLUDE_PATHS="-I. -I./include -I/usr/local/include -I/opt/homebrew/include"
        elif [ "${{ runner.os }}" == "Windows" ]; then
          make PLATFORM=PLATFORM_DESKTOP OBJS=src/*.cpp INCLUDE_PATHS="-I. -I./include" LDFLAGS="-L./lib"
        else
          make PLATFORM=PLATFORM_DESKTOP OBJS=src/*.cpp
        fi
      shell: bash

    - name: Create artifact archive
      run: |
        mkdir -p build/bin
        cp *.exe build/bin/ 2>/dev/null || :
        cp game build/bin/ 2>/dev/null || :
        cp main build/bin/ 2>/dev/null || :
        cd build/bin
        FILENAME="${{ matrix.platform.name }}"
        FILENAME_SAFE=$(echo "$FILENAME" | tr ' ' '_')
        
        if [ "${{ runner.os }}" == "Windows" ]; then
          7z a "../../${FILENAME_SAFE}.zip" .
        else
          tar -czvf "../../${FILENAME_SAFE}.tar.gz" .
        fi
        cd ../..
      shell: bash

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.platform.name }}-build
        path: build/bin

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          
      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
          
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          name: Build ${{ steps.date.outputs.date }}-${{ github.sha }}
          tag_name: build-${{ steps.date.outputs.date }}-${{ github.sha }}
          draft: true
          prerelease: false
          files: |
            artifacts/**/*.zip
            artifacts/**/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
