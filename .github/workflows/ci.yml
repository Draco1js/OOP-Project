name: CI

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]

defaults:
  run:
    shell: bash

jobs:
  build:
    name: ${{ matrix.platform.name }} ${{ matrix.config.name }}
    runs-on: ${{ matrix.platform.os }}

    strategy:
      fail-fast: false
      matrix:
        platform:
        - { name: Windows VS2019, os: windows-2019  }
        - { name: Windows VS2022, os: windows-2022  }
        - { name: Linux GCC,      os: ubuntu-latest }
        - { name: Linux Clang,    os: ubuntu-latest, flags: -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ }
        - { name: macOS,          os: macos-latest  }
        config:
        - { name: Shared, flags: -DBUILD_SHARED_LIBS=TRUE }
        - { name: Static, flags: -DBUILD_SHARED_LIBS=FALSE }

    steps:
    - name: Install Linux Dependencies
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install libxrandr-dev libxcursor-dev libxi-dev libudev-dev libflac-dev libvorbis-dev libgl1-mesa-dev libegl1-mesa-dev libfreetype-dev

    - name: Checkout
      uses: actions/checkout@v4

    - name: Configure
      run: cmake -B build ${{matrix.platform.flags}} ${{matrix.config.flags}}

    - name: Build
      run: cmake --build build --config Release

    - name: Fix macOS libraries
      if: runner.os == 'macOS'
      run: |
        # Find where the executable is located
        find build -name "main" -type f -o -name "*.app" -type d
        
        # For shared library builds, copy the SFML dylibs to the same directory as the executable
        if [[ "${{ matrix.config.name }}" == "Shared" ]]; then
          # Check if we're using a bundle
          if [ -d "build/bin/main.app" ]; then
            # Copy dylibs to the app bundle
            mkdir -p build/bin/main.app/Contents/Frameworks
            cp build/_deps/sfml-build/lib/*.dylib build/bin/main.app/Contents/Frameworks/
            # Fix the rpath in the executable
            install_name_tool -add_rpath @executable_path/../Frameworks build/bin/main.app/Contents/MacOS/main
          else
            # Regular executable
            mkdir -p build/bin/libs
            cp build/_deps/sfml-build/lib/*.dylib build/bin/
            # Fix the rpath in the executable if it exists
            if [ -f "build/bin/main" ]; then
              install_name_tool -add_rpath @executable_path/ build/bin/main
            fi
          fi
        fi

    - name: Create artifact archive
      run: |
        cd build/bin
        # Create a filename without spaces
        FILENAME="${{ matrix.platform.name }}-${{ matrix.config.name }}"
        FILENAME_SAFE=$(echo "$FILENAME" | tr ' ' '_')
        
        if [ "${{ runner.os }}" == "Windows" ]; then
          7z a "../../${FILENAME_SAFE}.zip" .
        else
          tar -czvf "../../${FILENAME_SAFE}.tar.gz" .
        fi
        cd ../..

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.platform.name }}-${{ matrix.config.name }}
        path: build/bin

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            artifacts/**/*.zip
            artifacts/**/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
