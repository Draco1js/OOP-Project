name: Build and Release

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: ${{ matrix.platform.name }} Build
    runs-on: ${{ matrix.platform.os }}
    
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: Windows, os: windows-latest }
          - { name: Linux, os: ubuntu-latest }
          - { name: macOS, os: macos-latest }

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Create directories
      run: |
        mkdir -p include
        mkdir -p lib
      shell: bash

    - name: Install Linux Dependencies
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y libxrandr-dev libxcursor-dev libxi-dev libudev-dev libgl1-mesa-dev libegl1-mesa-dev libxinerama-dev libxext-dev libwayland-dev

    - name: Install raylib (Linux)
      if: runner.os == 'Linux'
      run: |
        git clone https://github.com/raysan5/raylib.git
        cd raylib/src
        make PLATFORM=PLATFORM_DESKTOP
        sudo make install
        cp raylib.h "$GITHUB_WORKSPACE/include/"
      shell: bash

    - name: Install raylib (macOS)
      if: runner.os == 'macOS'
      run: |
        git clone https://github.com/raysan5/raylib.git
        cd raylib/src
        make PLATFORM=PLATFORM_DESKTOP
        # Copy files directly instead of using make install which has platform-specific issues
        cp libraylib.a "$GITHUB_WORKSPACE/lib/"
        cp raylib.h "$GITHUB_WORKSPACE/include/"
        cp raymath.h "$GITHUB_WORKSPACE/include/" || true
        cp rlgl.h "$GITHUB_WORKSPACE/include/" || true
      shell: bash

    - name: Install raylib (Windows)
      if: runner.os == 'Windows'
      run: |
        git clone https://github.com/raysan5/raylib.git
        cd raylib/src
        make PLATFORM=PLATFORM_DESKTOP
        # Copy files directly to our workspace directories
        cp raylib.h "$GITHUB_WORKSPACE/include/"
        cp libraylib.a "$GITHUB_WORKSPACE/lib/"
        # Copy additional header files that might be needed
        cp raymath.h "$GITHUB_WORKSPACE/include/" || true
        cp rlgl.h "$GITHUB_WORKSPACE/include/" || true
      shell: bash

    - name: Build with Make
      run: |
        if [ "${{ runner.os }}" == "macOS" ]; then
          make PLATFORM=PLATFORM_DESKTOP OBJS=src/*.cpp INCLUDE_PATHS="-I. -I./include -I/usr/local/include -I/opt/homebrew/include" LDFLAGS="-L./lib" RAYLIB_PATH="." RAYLIB_LIBTYPE=STATIC
        elif [ "${{ runner.os }}" == "Windows" ]; then
          make PLATFORM=PLATFORM_DESKTOP OBJS=src/*.cpp INCLUDE_PATHS="-I. -I./include" LDFLAGS="-L./lib" RAYLIB_PATH="." CFLAGS=""
        else
          make PLATFORM=PLATFORM_DESKTOP OBJS=src/*.cpp INCLUDE_PATHS="-I. -I./include" RAYLIB_PATH="."
        fi
      shell: bash

    - name: Create artifact archive
      run: |
        mkdir -p build/bin
        cp *.exe build/bin/ 2>/dev/null || :
        cp game build/bin/ 2>/dev/null || :
        cp main build/bin/ 2>/dev/null || :
        
        # Create platform-specific archive
        cd build/bin
        FILENAME="${{ matrix.platform.name }}"
        FILENAME_SAFE=$(echo "$FILENAME" | tr ' ' '_')
        
        if [ "${{ runner.os }}" == "Windows" ]; then
          7z a "../../${FILENAME_SAFE}.zip" .
        else
          tar -czvf "../../${FILENAME_SAFE}.tar.gz" .
        fi
        cd ../..
      shell: bash

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.platform.name }}-build
        path: |
          build/bin
          *.zip
          *.tar.gz

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          
      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
      
      - name: Prepare release files
        run: |
          mkdir -p release_files
          find artifacts -type f -name "*.exe" -o -name "game" -o -name "main" | xargs -I{} cp {} release_files/
          find artifacts -type f -name "*.zip" -o -name "*.tar.gz" | xargs -I{} cp {} release_files/
          ls -la release_files
      
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          name: Build ${{ steps.date.outputs.date }}-${{ github.sha }}
          tag_name: build-${{ steps.date.outputs.date }}-${{ github.sha }}
          draft: true
          prerelease: false
          files: release_files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
